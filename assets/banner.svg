<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><title id="bt">Markdown Note-taking App</title><desc id="bd">Animated banner: Markdown is typed into a note and then appears rendered as formatted text.</desc><rect width="1200" height="320" rx="18" fill="#0f1c2e"/><text x="64" y="112" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#eaf3ff" letter-spacing="-0.5">Markdown Note-taking App</text><text x="66" y="152" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#9db4d0">A lightweight Java REST API: save, list, render and check notes</text><text x="66" y="236" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#4cc9f0" opacity="0">Save a note as Markdown.<animate attributeName="fill" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0286;0.2214;0.25;1" dur="14s" repeatCount="indefinite"/></text><text x="66" y="236" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#b8f35a" opacity="0">List everything you saved.<animate attributeName="fill" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2786;0.4714;0.5;1" dur="14s" repeatCount="indefinite"/></text><text x="66" y="236" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#ff9f6e" opacity="0">Render any note as HTML.<animate attributeName="fill" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5286;0.7214;0.75;1" dur="14s" repeatCount="indefinite"/></text><text x="66" y="236" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#c77dff" opacity="0">Check its grammar.<animate attributeName="fill" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="-12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.7786;0.9714;1" dur="14s" repeatCount="indefinite"/></text><text x="694" y="50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9db4d0">note.md</text><rect x="690" y="60" width="220" height="170" rx="12" fill="#16263d" stroke="#4cc9f0" stroke-width="2"><animate attributeName="stroke" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="0s" repeatCount="indefinite"/></rect><text x="954" y="50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9db4d0">text/html</text><rect x="950" y="60" width="220" height="170" rx="12" fill="#16263d" stroke="#ff9f6e" stroke-width="2"><animate attributeName="stroke" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="-8s" repeatCount="indefinite"/></rect><text x="706" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#eaf3ff" textLength="101.4" lengthAdjust="spacing" xml:space="preserve"># Hello World</text><rect x="705" y="89" width="105.4" height="18" fill="#16263d"><animate attributeName="x" values="705;705;810.4;810.4;705;705" keyTimes="0;0.0571;0.1214;0.95;0.951;1" dur="14s" repeatCount="indefinite"/><animate attributeName="width" values="105.4;105.4;0;0;105.4;105.4" keyTimes="0;0.0571;0.1214;0.95;0.951;1" dur="14s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0571;0.15" dur="14s" repeatCount="indefinite" calcMode="discrete"/><rect x="706" y="90" width="6" height="15" fill="#eaf3ff"><animate attributeName="x" values="706;706;712;712" keyTimes="0;0.0571;0.1214;1" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></rect></g><text x="706" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#eaf3ff" textLength="124.8" lengthAdjust="spacing" xml:space="preserve">This is **bold**</text><rect x="705" y="123" width="128.8" height="18" fill="#16263d"><animate attributeName="x" values="705;705;833.8;833.8;705;705" keyTimes="0;0.1429;0.2214;0.95;0.951;1" dur="14s" repeatCount="indefinite"/><animate attributeName="width" values="128.8;128.8;0;0;128.8;128.8" keyTimes="0;0.1429;0.2214;0.95;0.951;1" dur="14s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1429;0.25" dur="14s" repeatCount="indefinite" calcMode="discrete"/><rect x="706" y="124" width="6" height="15" fill="#eaf3ff"><animate attributeName="x" values="706;706;712;712" keyTimes="0;0.1429;0.2214;1" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></rect></g><text x="706" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#eaf3ff" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">and *italic*.</text><rect x="705" y="149" width="105.4" height="18" fill="#16263d"><animate attributeName="x" values="705;705;810.4;810.4;705;705" keyTimes="0;0.2357;0.3;0.95;0.951;1" dur="14s" repeatCount="indefinite"/><animate attributeName="width" values="105.4;105.4;0;0;105.4;105.4" keyTimes="0;0.2357;0.3;0.95;0.951;1" dur="14s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2357;0.3286" dur="14s" repeatCount="indefinite" calcMode="discrete"/><rect x="706" y="150" width="6" height="15" fill="#eaf3ff"><animate attributeName="x" values="706;706;712;712" keyTimes="0;0.2357;0.3;1" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></rect></g><text x="706" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#eaf3ff" textLength="117" lengthAdjust="spacing" xml:space="preserve">- check grammar</text><rect x="705" y="175" width="121" height="18" fill="#16263d"><animate attributeName="x" values="705;705;826;826;705;705" keyTimes="0;0.3143;0.3857;0.95;0.951;1" dur="14s" repeatCount="indefinite"/><animate attributeName="width" values="121;121;0;0;121;121" keyTimes="0;0.3143;0.3857;0.95;0.951;1" dur="14s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3143;0.4143" dur="14s" repeatCount="indefinite" calcMode="discrete"/><rect x="706" y="176" width="6" height="15" fill="#eaf3ff"><animate attributeName="x" values="706;706;712;712" keyTimes="0;0.3143;0.3857;1" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/></rect></g><line x1="918" y1="145" x2="944" y2="145" stroke="#2f4a6b" stroke-width="2"/><path d="M 938 139 L 946 145 L 938 151" fill="none" stroke="#2f4a6b" stroke-width="2" stroke-linecap="round"/><g opacity="0"><animateMotion path="M 916 145 L 944 145" dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3929;0.4429;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3929;0.4029;0.4429;0.4529;1" dur="14s" repeatCount="indefinite"/><circle r="8" fill="#b8f35a" opacity="0.25"/><circle r="4" fill="#b8f35a"/></g><text x="966" y="104" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#ff9f6e" opacity="0">Hello World<animate attributeName="fill" values="#4cc9f0;#b8f35a;#ff9f6e;#c77dff;#f9e45b;#4cc9f0" dur="20s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4571;0.4857;0.9143;0.9429;1" dur="14s" repeatCount="indefinite"/></text><text x="966" y="138" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eaf3ff" opacity="0">This is <tspan font-weight="700">bold</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4857;0.5143;0.9143;0.9429;1" dur="14s" repeatCount="indefinite"/></text><text x="966" y="164" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eaf3ff" opacity="0">and <tspan font-style="italic">italic</tspan>.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5143;0.5429;0.9143;0.9429;1" dur="14s" repeatCount="indefinite"/></text><text x="966" y="190" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#eaf3ff" opacity="0">• check grammar<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5429;0.5714;0.9143;0.9429;1" dur="14s" repeatCount="indefinite"/></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
